<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Game for Todlers</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>


<body>
    <main>
        <nav>
            <button id="bathroom-button">Bathroom</button>
            <button id="kitchen-button">Kitchen</button>
        </nav>

        <div id="kitchen-page">
            <!--Add BG image-->
            <img class="background" src="Assignment2/assets/kitchen.png" alt="kitchen-bg">

            <!--Add Buttons-->
            <button class="sticker"><img src="Assignment2/assets/kitchen/bottom cabinate.PNG" alt="bottom-cabinate"></button>
            <button class="sticker"><img src="Assignment2/assets/kitchen/cups.PNG" alt="cups"></button>
            <button class="sticker"><img src="Assignment2/assets/kitchen/fridge.PNG" alt="fridge"></button>
            <button class="sticker"><img src="Assignment2/assets/kitchen/kettle.PNG" alt="kettle"></button>
            <button class="sticker"><img src="Assignment2/assets/kitchen/oven.PNG" alt="oven"></button>
            <button class="sticker"><img src="Assignment2/assets/kitchen/plates.PNG" alt="plates"></button>
            <button class="sticker"><img src="Assignment2/assets/kitchen/sink1.PNG" alt="sink"></button>
            <button class="sticker"><img src="Assignment2/assets/kitchen/smoke vacume.PNG" alt="smoke-vacume"></button>


        </div>

        <div id="bathroom-page">
            <img class="background" src="Assignment2/assets/bathroom.png" alt="bathroom-bg">

            <button class="sticker"><img src="Assignment2/assets/bathroom/bidet.PNG" alt="bidet"></button>
            <button class="sticker"><img src="Assignment2/assets/bathroom/cabinate.PNG" alt="cabinate"></button>
            <button class="sticker"><img src="Assignment2/assets/bathroom/fabric.PNG" alt=""></button>
            <button class="sticker"><img src="Assignment2/assets/bathroom/mirror.PNG" alt=""></button>
            <button class="sticker"><img src="Assignment2/assets/bathroom/sink.PNG" alt=""></button>
            <button class="sticker"><img src="Assignment2/assets/bathroom/tapWater.PNG" alt=""></button>
            <button class="sticker"><img src="Assignment2/assets/bathroom/tissue.PNG" alt=""></button>

        </div>
    </main>
    
</body>


</html>
