<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Game for Todlers</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>


<body>
    <main>
        <nav>
            <button id="bathroom-button">Bathroom</button>
            <button id="kitchen-button">Kitchen</button>
        </nav>

        <div id="bathroom-page">
            <img class="background" src="assets/bathroom.png" alt="bathroom-bg">

            <button class="sticker bidet"data-sound="toilet_flood.wav" >
                <img src="assets/bathroom/bidet.PNG" alt="bidet"></button>

            <button class="sticker cabinate" data-sound="door squeak.mp3">
                <img src="assets/bathroom/cabinate.PNG" alt="cabinate"></button>

            <button class="sticker fabric" data-sound="fabric.mp3">
                <img src="assets/bathroom/fabric.PNG" alt=""></button>

            <button class="sticker mirror" data-sound="mirror.mp3">
                <img src="assets/bathroom/mirror.PNG" alt=""></button>

            <button class="sticker sink" data-sound="sink.wav">
                <img src="assets/bathroom/sink.PNG" alt=""></button>

            <button class="sticker tapWater" data-sound="bathtub.mp3">
                <img src="assets/bathroom/tapWater.PNG" alt=""></button>

            <button class="sticker tissue" data-sound="toilet.wav">
                <img src="assets/bathroom/tissue.PNG" alt=""></button>

        </div>

        <div id="kitchen-page">
            <!--Add BG image-->
            <img class="background" src="assets/kitchen.png" alt="kitchen-bg">

            <!--Add Buttons-->
            <button class="sticker bottom-cabinate" data-sound="cabinet.mp3">
                <img src="assets/kitchen/bottom cabinate.PNG" alt="bottom-cabinate"></button>

            <button class="sticker cups" data-sound="cups.wav">
                <img src="assets/kitchen/cups.PNG" alt="cups"></button>

            <button class="sticker fridge" data-sound="fridge.mp3">
                <img src="assets/kitchen/fridge.PNG" alt="fridge"></button>
                
            <button class="sticker kettle" data-sound="kettle.mp3">
                <img src="assets/kitchen/kettle.PNG" alt="kettle"></button>

            <button class="sticker oven" data-sound="oven.mp3">
                <img src="assets/kitchen/oven.PNG" alt="oven"></button>

            <button class="sticker plates" data-sound="plates.mp3">
                <img src="assets/kitchen/plates.PNG" alt="plates"></button>

            <button class="sticker sink" data-sound="water.mp3">
                <img src="assets/kitchen/sink1.PNG" alt="sink"></button>

            <button class="sticker smoke-vacume" data-sound="smoke.mp3">
                <img src="assets/kitchen/smoke vacume.PNG" alt="smoke-vacume"></button>


        </div>

        
    </main>
    
</body>


</html>
